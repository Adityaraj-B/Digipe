name: digipe
description: DIGIPe Solar Insurance Platform
publish_to: 'none'
version: 1.0.5+6

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^8.1.5
  equatable: ^2.0.5
  shared_preferences: ^2.5.3

  # Navigation
  go_router: ^13.0.0

  # Network
  dio: ^5.4.3
  connectivity_plus: ^6.0.3

  # Security
  flutter_secure_storage: ^9.0.0
  safe_device: ^1.1.4
  screen_protector: ^1.3.3
  local_auth: ^2.2.0

  # Payment
  flutter_cashfree_pg_sdk: 2.4.0+52

  # DI
  get_it: ^7.6.7
  dartz: ^0.10.1

  # UI / UX
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0

  # Utils
  intl: ^0.19.0
  package_info_plus: ^8.0.0
  permission_handler: ^11.3.1
  file_picker: ^8.0.3
  image_picker: ^1.1.2
  tracelet: ^1.0.0

  # Animations
  confetti: ^0.7.0

  # Notifications
  flutter_local_notifications: ^22.0.1

  url_launcher: ^6.3.0
  webview_flutter: ^4.8.0

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.3
  bloc_test: ^9.1.7
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800

  assets:
    - assets/images/
    - assets/fonts/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/Icon.png"
  adaptive_icon_background: "#131313"
  adaptive_icon_foreground: "assets/images/Icon.png"
  min_sdk_android: 21
