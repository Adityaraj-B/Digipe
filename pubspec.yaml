name: digipe
description: DIGIPe Solar Insurance Platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^8.1.5
  equatable: ^2.0.5

  # Navigation
  go_router: ^13.0.0

  # Network
  dio: ^5.4.3
  connectivity_plus: ^6.0.3

  # Security
  flutter_secure_storage: ^9.0.0

  # DI
  get_it: ^7.6.7
  dartz: ^0.10.1

  # UI / UX
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0

  # Utils
  intl: ^0.19.0
  package_info_plus: ^8.0.0
  permission_handler: ^11.3.1
  file_picker: ^8.0.3
  image_picker: ^1.1.2

  # Animations
  confetti: ^0.7.0

  # Notifications
  flutter_local_notifications: ^17.0.0

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.3
  bloc_test: ^9.1.7

flutter:
  uses-material-design: true

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800

  assets:
    - assets/images/
    - assets/fonts/
